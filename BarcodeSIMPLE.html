const appFrame=document.getElementById("appFrame");
const candidateFrame=document.getElementById("candidateFrame");
let activeMode="frozen";
let busy=false;

function decodeFrozen(){
  const bin=atob(FROZEN_APP_B64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
const FROZEN_HTML=decodeFrozen();

function parseApp(html){
  try{
    const doc=new DOMParser().parseFromString(String(html||""),"text/html");
    const identity=doc.querySelector('meta[name="barcode-simple-app"]')?.content?.trim();
    const version=doc.querySelector('meta[name="app-version"]')?.content?.trim();
    if(identity!=="1"||!version||!doc.body)return null;
    return{html:String(html),version};
  }catch(_e){return null;}
}

function readInstalled(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return null;
    const saved=JSON.parse(raw);
    const parsed=parseApp(saved?.html);
    if(!parsed){localStorage.removeItem(STORAGE_KEY);return null;}
    return{...parsed,installedAt:saved.installedAt||null};
  }catch(_e){return null;}
}

function saveInstalled(app){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({html:app.html,version:app.version,installedAt:new Date().toISOString()}));
}

function clearInstalled(){
  try{localStorage.removeItem(STORAGE_KEY);}catch(_e){}
}

function injectUpdateButton(){
  let doc;
  try{doc=appFrame.contentDocument;}catch(_e){return;}
  if(!doc)return;
  doc.getElementById("shellUpdateButton")?.remove();
  const printBtn=doc.getElementById("printButton");
  const topbar=doc.querySelector(".topbar");
  if(!topbar)return;
  let actions=doc.querySelector(".top-actions");
  if(!actions){
    actions=doc.createElement("div");
    actions.className="top-actions";
    actions.style.cssText="display:flex;align-items:center;gap:10px;flex-wrap:wrap";
    if(printBtn){printBtn.parentNode.insertBefore(actions,printBtn);actions.appendChild(printBtn);}
    else topbar.appendChild(actions);
  }
  const btn=doc.createElement("button");
  btn.id="shellUpdateButton";
  btn.type="button";
  btn.className="shell-update-btn"+(activeMode==="updated"?" revert":"");
  btn.style.cssText=[
    "border:1px solid rgba(255,255,255,.28)",
    "border-radius:12px",
    "background:"+(activeMode==="updated"?"#7f1d1d":"rgba(255,255,255,.12)"),
    "color:#fff",
    "font:800 .9rem/1 'Segoe UI',Tahoma,Arial,sans-serif",
    "padding:13px 17px",
    "cursor:pointer",
    "white-space:nowrap"
  ].join(";");
  btn.textContent=activeMode==="updated"?"Revert | رجوع":"Update | تحديث";
  btn.title=activeMode==="updated"?"Return to the built-in frozen version":"Install the latest SIMPLE update";
  btn.disabled=busy;
  btn.addEventListener("click",()=>{
    if(busy)return;
    if(activeMode==="updated")revertToFrozen();
    else installUpdate();
  });
  actions.insertBefore(btn,actions.firstChild);
}

function loadVisible(html,mode){
  activeMode=mode;
  return new Promise(resolve=>{
    appFrame.onload=()=>{
      injectUpdateButton();
      resolve();
    };
    appFrame.srcdoc=html;
  });
}

function validateByRunning(app){
  return new Promise((resolve,reject)=>{
    let finished=false;
    const timeout=setTimeout(()=>finish(false,"Update did not start correctly."),3500);
    function finish(ok,message){
      if(finished)return;
      finished=true;
      clearTimeout(timeout);
      candidateFrame.onload=null;
      candidateFrame.srcdoc="";
      ok?resolve():reject(new Error(message||"Invalid update."));
    }
    candidateFrame.onload=()=>{
      setTimeout(()=>{
        try{
          const ready=candidateFrame.contentWindow?.__BARCODE_SIMPLE_READY__===true;
          finish(ready,ready?"":"The downloaded app failed its startup check.");
        }catch(_e){finish(false,"The downloaded app could not be verified.");}
      },80);
    };
    candidateFrame.srcdoc=app.html;
  });
}

async function installUpdate(){
  busy=true;injectUpdateButton();
  const btn=appFrame.contentDocument?.getElementById("shellUpdateButton");
  if(btn)btn.textContent="Updating… | جارٍ التحديث…";
  try{
    const response=await fetch(UPDATE_URL,{cache:"no-store"});
    if(!response.ok)throw new Error(`Download failed (HTTP ${response.status}).`);
    const html=await response.text();
    const candidate=parseApp(html);
    if(!candidate)throw new Error("Downloaded file is not a valid SIMPLE app update.");
    await validateByRunning(candidate);
    try{saveInstalled(candidate);}
    catch(_e){throw new Error("The update worked, but this browser could not save it locally.");}
    busy=false;
    await loadVisible(candidate.html,"updated");
  }catch(err){
    busy=false;injectUpdateButton();
    alert("Update failed. The current version was not changed.\n\n"+(err?.message||String(err)));
  }
}

async function revertToFrozen(){
  busy=true;injectUpdateButton();
  clearInstalled();
  busy=false;
  await loadVisible(FROZEN_HTML,"frozen");
}
