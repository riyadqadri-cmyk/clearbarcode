<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BarcodePRO</title>

    <!-- SHELL STYLES — never swapped -->
    <style id="shell-style">
      :root {
        --bg: #eef2f7;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #dbe3ec;
        --primary: #2563eb;
        --danger: #dc2626;
        --success: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
      }

      button,
      input,
      select {
        font: inherit;
      }

      #shellBootScreen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        z-index: 9000;
        font-weight: 700;
        color: var(--muted);
        transition: opacity .2s ease;
      }

      #shellBootScreen.hidden {
        display: none;
      }

      #shellBootScreen .boot-inner {
        text-align: center;
      }

      #shellBootScreen .boot-err {
        margin-top: 12px;
        color: var(--danger);
        font-weight: 600;
        font-size: .9rem;
        max-width: 400px;
      }

      #shellModal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, .55);
        display: none;
        place-items: center;
        z-index: 9500;
        padding: 20px;
      }

      #shellModal.open {
        display: grid;
      }

      #shellModal .modal-card {
        background: #fff;
        border-radius: 16px;
        width: min(480px, 100%);
        box-shadow: 0 24px 60px rgba(15, 23, 42, .35);
        overflow: hidden;
      }

      #shellModal .modal-head {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        font-weight: 800;
        font-size: 1.1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #shellModal .modal-close {
        border: 0;
        background: transparent;
        font-size: 1.4rem;
        cursor: pointer;
        color: var(--muted);
        line-height: 1;
      }

      #shellModal .modal-body {
        padding: 20px;
      }

      #shellModal .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: .92rem;
      }

      #shellModal .row:last-of-type {
        border-bottom: 0;
      }

      #shellModal .row .label {
        color: var(--muted);
        font-weight: 700;
      }

      #shellModal .row .value {
        text-align: right;
        word-break: break-all;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: .86rem;
      }

      #shellStatus {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: .88rem;
        background: #f1f5f9;
        color: var(--muted);
        min-height: 20px;
        line-height: 1.4;
      }

      #shellStatus.ok {
        background: #ecfdf5;
        color: #166534;
        border: 1px solid #bbf7d0;
      }

      #shellStatus.err {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      #shellStatus.busy {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
      }

      #shellModal .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      #shellModal .modal-actions .btn {
        width: 100%;
      }

      #shellModal .btn {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 700;
        background: #fff;
        color: var(--text);
      }

      #shellModal .btn:hover {
        filter: brightness(.97);
      }

      #shellModal .btn:disabled {
        opacity: .55;
        cursor: not-allowed;
      }

      #shellModal .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      #shellModal .btn-outline {
        border-color: #cbd5e1;
      }

      #shellModal .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      #shellSettingsButton {
        position: fixed;
        top: 18px;
        right: 24px;
        z-index: 8000;
        border-radius: 10px;
        padding: 10px 14px;
        background: #1e293b;
        color: #fff;
        border: 1px solid #334155;
        cursor: pointer;
        font-weight: 700;
        font-size: .9rem;
      }

      #shellSettingsButton:hover {
        filter: brightness(1.1);
      }

      @media (max-width: 760px) {
        #shellSettingsButton {
          top: 12px;
          right: 12px;
          padding: 8px 11px;
          font-size: .82rem;
        }
      }

      #appMount {
        min-height: 100vh;
      }

      #appMount:empty {
        display: none;
      }
    </style>

    <!-- APP STYLES SLOT — replaced on every boot -->
    <style data-shell-app-style></style>

  </head>

  <body>

    <div id="shellBootScreen">
      <div class="boot-inner">
        <div>Loading BarcodePRO…</div>
        <div class="boot-err" id="shellBootError"></div>
      </div>
    </div>

    <button id="shellSettingsButton" type="button" title="Settings">⚙ Settings</button>

    <div id="appMount"></div>

    <div id="shellModal" role="dialog" aria-modal="true" aria-labelledby="shellModalTitle">
      <div class="modal-card">
        <div class="modal-head">
          <span id="shellModalTitle">BarcodePRO Settings</span>
          <button class="modal-close" type="button" id="shellModalClose" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="row"><span class="label">Version</span><span class="value" id="shellInfoVersion">—</span></div>
          <div class="row"><span class="label">Source</span><span class="value" id="shellInfoSource">—</span></div>
          <div class="row"><span class="label">Last updated</span><span class="value" id="shellInfoFetched">—</span></div>

          <div id="shellStatus">Ready.</div>

          <div class="modal-actions">
            <button class="btn btn-primary" type="button" id="shellUpdateBtn">Update</button>
            <button class="btn btn-danger" type="button" id="shellRevertBtn">Revert to default</button>
          </div>
        </div>
      </div>
    </div>

          }

          }

        }

              "barcode-number": "Barcode number",
              "custom-text": "Custom text"
            }[type] || type;
          }

          function elementText(el) {
            if (el.value !== undefined) return String(el.value);
            if (el.type === "name") return data.itemName;
            if (el.type === "price") return el.prefix !== undefined ? el.prefix + data.price : data.price;
            if (el.type === "barcode-number") return data.barcode;
            if (el.type === "barcode-image") return data.barcode;
            if (el.type === "custom-text") return el.text || "Custom text";
            return "";
          }

          const CODE128_PATTERNS = [
            "212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213", "221312", "231212",
            "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132", "221231", "213212", "223112", "312131",
            "311222", "321122", "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123", "131321",
            "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121",
            "313121", "211331", "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111",
            "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412", "122114",
            "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111", "111242", "121142", "121241", "114212",
            "124112", "124211", "411212", "421112", "421211", "212141", "214121", "412121", "111143", "111341", "131141", "114113",
            "114311", "411113", "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"
          ];

          function escapeSvgText(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/"/g, "&quot;");
          }

          function code128Structure(rawValue) {
            let value = String(rawValue ?? "").replace(/[^\x20-\x7E]/g, "?");
            if (!value) value = " ";
            let codes = [];
            let codeSet = "B";
            if (/^\d+$/.test(value) && value.length >= 4) {
              if (value.length % 2 === 0) {
                codes = [105]; codeSet = "C";
                for (let i = 0; i < value.length; i += 2) codes.push(Number(value.slice(i, i + 2)));
              } else {
                codes = [104, value.charCodeAt(0) - 32, 99]; codeSet = "B→C";
                for (let i = 1; i < value.length; i += 2) codes.push(Number(value.slice(i, i + 2)));
              }
            } else {
              codes = [104];
              for (const ch of value) codes.push(ch.charCodeAt(0) - 32);
            }
            let checksum = codes[0];
            for (let i = 1; i < codes.length; i++) checksum += codes[i] * i;
            codes.push(checksum % 103, 106);
            const modules = [];
            for (const code of codes) {
              const pattern = CODE128_PATTERNS[code];
              for (const digit of pattern) modules.push(Number(digit));
            }
            const quietModules = 10;
            const barModules = modules.reduce((a, b) => a + b, 0);
            const totalModules = quietModules * 2 + barModules;
            return {value, codes, modules, quietModules, barModules, totalModules, codeSet};
          }

          function makeCode128Svg(rawValue) {
            const info = code128Structure(rawValue);
            let x = info.quietModules;
            let bars = "";
            let black = true;
            for (const width of info.modules) {
              if (black) bars += `<rect x="${x}" y="0" width="${width}" height="100"/>`;
              x += width;
              black = !black;
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${info.totalModules} 100" preserveAspectRatio="none" role="img" aria-label="Barcode ${escapeSvgText(info.value)}"><rect width="100%" height="100%" fill="white"/><g fill="black">${bars}</g></svg>`;
          }

          const EAN_L = ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"];
          const EAN_G = ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"];
          const EAN_R = ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1000100", "1001000", "1110100"];
          const EAN_PARITY = ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"];

          function ean13CheckDigit(first12) {
            if (!/^\d{12}$/.test(first12)) return null;
            let sum = 0;
            for (let i = 0; i < 12; i++) sum += Number(first12[i]) * (i % 2 === 0 ? 1 : 3);
            return String((10 - (sum % 10)) % 10);
          }
          function normalizeEan13(rawValue) {
            const raw = String(rawValue ?? "").trim();
            if (!/^\d{13}$/.test(raw)) return null;
            if (ean13CheckDigit(raw.slice(0, 12)) !== raw[12]) return null;
            return raw;
          }
          function makeEan13Svg(rawValue) {
            const value = normalizeEan13(rawValue);
            if (!value) return null;
            const parity = EAN_PARITY[Number(value[0])];
            let bits = "101";
            for (let i = 1; i <= 6; i++) {
              const digit = Number(value[i]);
              bits += parity[i - 1] === "L" ? EAN_L[digit] : EAN_G[digit];
            }
            bits += "01010";
            for (let i = 7; i <= 12; i++) bits += EAN_R[Number(value[i])];
            bits += "101";
            const leftQuiet = 11, rightQuiet = 7;
            const totalModules = leftQuiet + 95 + rightQuiet;
            let bars = "";
            for (let i = 0; i < bits.length; i++) {
              if (bits[i] !== "1") continue;
              const isGuard = i < 3 || (i >= 45 && i < 50) || i >= 92;
              bars += `<rect x="${leftQuiet + i}" y="0" width="1" height="${isGuard ? 100 : 92}"/>`;
            }
            return {
              value, totalModules,
              svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalModules} 100" preserveAspectRatio="none" role="img" aria-label="EAN-13 ${value}"><rect width="100%" height="100%" fill="white"/><g fill="black">${bars}</g></svg>`
            };
          }

          const PRINTER_DPI = 203;
          const DOT_MM = 25.4 / PRINTER_DPI;

          function barcodeInfo(rawValue) {
            const raw = String(rawValue ?? "").trim();
            const ean = makeEan13Svg(raw);
            if (ean) {
              const xMm = DOT_MM * 2;
              return {
                symbology: "EAN-13", encodedValue: raw,
                totalModules: ean.totalModules, barModules: 95, quietModules: 18,
                fixedXmm: xMm, minHeightMm: 9.5, recommendedHeightMm: 10.5,
                svg: ean.svg,
                note: `Exact 13-digit EAN-13 · ${xMm.toFixed(3)} mm/module (2 dots @ ${PRINTER_DPI} dpi)`
              };
            }
            const code = code128Structure(raw);
            const maxTotalMm = Math.max(20, (layout?.widthMm || 38) - 1.0);
            const x3 = DOT_MM * 3, x2 = DOT_MM * 2;
            const xMm = code.totalModules * x3 <= maxTotalMm ? x3 : x2;
            const invalidEan = /^\d{13}$/.test(raw)
              ? "13 digits entered, but the EAN-13 check digit is invalid; the exact value is encoded as Code 128."
              : "Exact value encoded as Code 128.";
            return {
              symbology: `Code 128 (${code.codeSet})`, encodedValue: code.value,
              totalModules: code.totalModules, barModules: code.barModules,
              quietModules: code.quietModules * 2, fixedXmm: xMm,
              minHeightMm: 9.5, recommendedHeightMm: 9.7,
              svg: makeCode128Svg(raw),
              note: `${invalidEan} ${xMm.toFixed(3)} mm/module (${Math.round(xMm / DOT_MM)} dots @ ${PRINTER_DPI} dpi).`
            };
          }

          function barcodeSizing(el) {
            const info = barcodeInfo(elementText(el));
            const widthMm = Math.max(0, Number(el.w) || 0) / PX_PER_MM;
            const heightMm = Math.max(0, Number(el.h) || 0) / PX_PER_MM;
            const requiredWidthMm = info.totalModules * info.fixedXmm;
            const xMm = widthMm / Math.max(1, info.totalModules);
            const safeWidth = Math.abs(widthMm - requiredWidthMm) <= 0.12;
            const safeHeight = heightMm >= info.minHeightMm;
            return {...info, widthMm, heightMm, xMm, minWidthMm: requiredWidthMm, targetWidthMm: requiredWidthMm, safeWidth, safeHeight, safe: safeWidth && safeHeight};

          function safeBarcodeWidthPx(el) {
            const info = barcodeInfo(elementText(el));
            return info.totalModules * info.fixedXmm * PX_PER_MM;
          }
          function autoSizeBarcode(el) {
            if (!el || el.type !== "barcode-image") return;
            const info = barcodeInfo(elementText(el));
            el.w = info.totalModules * info.fixedXmm * PX_PER_MM;
            el.h = Math.max(info.recommendedHeightMm * PX_PER_MM, 18);
            const canvasWidth = Math.max(1, layout.widthMm * PX_PER_MM);
            const canvasHeight = Math.max(1, layout.heightMm * PX_PER_MM);
            el.x = Math.max(0, (canvasWidth - el.w) / 2);
            el.y = clamp(Number(el.y) || 0, 0, Math.max(0, canvasHeight - el.h));
          }

          function loadLayout() {
            try {
              const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
              if (saved && Array.isArray(saved.elements)) return saved;
            } catch (error) {console.warn("Could not load barcode layout", error);}
            return defaultLayout();
          }

          function persistLayout(showMessage = true) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
            localStorage.setItem(STORAGE_KEY + "_item", JSON.stringify(data));
            if (showMessage) {
              saveStatus.textContent = "Layout saved in this browser.";
              clearTimeout(persistLayout.timer);
              persistLayout.timer = setTimeout(() => saveStatus.textContent = "", 2200);
            }
          }

          function calculatePreviewScale() {
            const panel = document.querySelector(".canvas-panel");
            const baseWidth = Math.max(1, layout.widthMm * PX_PER_MM);
            const baseHeight = Math.max(1, layout.heightMm * PX_PER_MM);
            const horizontalPadding = window.innerWidth <= 760 ? 28 : 96;
            const verticalPadding = window.innerWidth <= 760 ? 28 : 96;
            const availableWidth = Math.max(140, panel.clientWidth - horizontalPadding);
            const availableHeight = Math.max(180, panel.clientHeight - verticalPadding);
            return clamp(Math.min(availableWidth / baseWidth, availableHeight / baseHeight), 0.2, 4);
          }

          function applyCanvasSize() {
            document.documentElement.style.setProperty("--label-width-mm", layout.widthMm);
            document.documentElement.style.setProperty("--label-height-mm", layout.heightMm);
            const baseWidth = layout.widthMm * PX_PER_MM;
            const baseHeight = layout.heightMm * PX_PER_MM;
            previewScale = calculatePreviewScale();
            canvas.style.width = baseWidth + "px";
            canvas.style.height = baseHeight + "px";
            canvas.style.transform = `scale(${previewScale})`;
            canvas.style.transformOrigin = "top left";
            const wrapPadding = window.innerWidth <= 760 ? 80 : 280;
            canvasWrap.style.width = (baseWidth * previewScale + wrapPadding) + "px";
            canvasWrap.style.height = (baseHeight * previewScale + wrapPadding) + "px";
            canvas.classList.toggle("grid-on", layout.grid !== false);
            controls.labelWidth.value = layout.widthMm;
            controls.labelHeight.value = layout.heightMm;
            controls.gridToggle.value = layout.grid === false ? "off" : "on";
          }

          function createContent(el) {
            const content = document.createElement("div");
            content.className = "element-content";
            if (el.type === "barcode-image") {
              content.innerHTML = barcodeInfo(elementText(el)).svg;
            } else {
              content.textContent = elementText(el);
              content.style.fontSize = (el.fontSize || 14) + "px";
              content.style.fontWeight = el.fontWeight || "700";
              content.style.textAlign = el.textAlign || "center";
              content.style.justifyContent = el.textAlign === "left" ? "flex-start" : el.textAlign === "right" ? "flex-end" : "center";
              content.style.whiteSpace = "normal";
              content.style.lineHeight = "1.05";
            }
            return content;
          }

          function render() {
            applyCanvasSize();
            canvas.innerHTML = "";
            layout.elements.forEach(el => {
              const node = document.createElement("div");
              node.className = "designer-element" + (el.id === selectedId ? " selected" : "");
              node.dataset.id = el.id;
              node.style.left = el.x + "px";
              node.style.top = el.y + "px";
              node.style.width = el.w + "px";
              node.style.height = el.h + "px";
              node.appendChild(createContent(el));
              const handle = document.createElement("div");
              handle.className = "resize-handle";
              handle.dataset.resize = "1";
              node.appendChild(handle);
              canvas.appendChild(node);
            });
            renderElementList();
            updateProperties();
          }

          function renderElementList() {
            elementList.innerHTML = "";
            layout.elements.forEach((el, index) => {
              const row = document.createElement("div");
              row.className = "element-row" + (el.id === selectedId ? " active" : "");
              row.dataset.id = el.id;
              row.innerHTML = `<span class="element-row-name">${index + 1}. ${typeLabel(el.type)}</span><button class="mini-danger" type="button" title="Delete">×</button>`;
              row.addEventListener("click", event => {
                if (event.target.closest("button")) {deleteElement(el.id); return;}
                selectElement(el.id);
              });
              elementList.appendChild(row);
            });
          }

          function selectedElement() {return layout.elements.find(el => el.id === selectedId) || null;}
          function selectElement(id) {selectedId = id; render();}

          function updateProperties() {
            const el = selectedElement();
            noSelection.hidden = !!el;
            properties.hidden = !el;
            if (!el) return;
            const isText = el.type !== "barcode-image";
            controls.text.disabled = false;
            controls.text.value = elementText(el);
            elementTextLabel.textContent = el.type === "barcode-image" ? "Barcode value" : "Content / value";
            elementTextHelp.textContent = el.type === "barcode-image"
              ? "Exactly 13 valid EAN digits use EAN-13. Every other value uses Code 128."
              : "Edit to override the item value for this label element.";
            barcodeHealth.className = "barcode-health";
            barcodeHealth.textContent = "";
            if (el.type === "barcode-image") {
              const b = barcodeSizing(el);
              const widthText = `${b.widthMm.toFixed(1)} mm wide · ${b.heightMm.toFixed(1)} mm high · module ${b.xMm.toFixed(3)} mm`;
              if (b.safe) {
                barcodeHealth.classList.add("ok");
                barcodeHealth.textContent = `✓ ${b.symbology} · ${widthText}. ${b.note}`;
              } else {
                barcodeHealth.classList.add(b.safeWidth ? "warn" : "bad");
                const problems = [];
                if (!b.safeWidth) problems.push(`too narrow; minimum ≈ ${b.minWidthMm.toFixed(1)} mm`);
                if (!b.safeHeight) problems.push(`too short; use at least ${b.minHeightMm.toFixed(0)} mm height`);
                barcodeHealth.textContent = `⚠ ${b.symbology} · ${widthText}. ${problems.join("; ")}. ${b.note}`;
              }
            }
            controls.fontSize.disabled = !isText;
            controls.fontWeight.disabled = !isText;
            controls.textAlign.disabled = !isText;
            controls.fontSize.value = el.fontSize || 14;
            controls.fontWeight.value = el.fontWeight || "700";
            controls.textAlign.value = el.textAlign || "center";
            controls.x.value = Math.round(el.x);
            controls.y.value = Math.round(el.y);
            controls.w.value = Math.round(el.w);
            controls.h.value = Math.round(el.h);
            controls.w.disabled = el.type === "barcode-image";
          }

          function addElement(type) {
            const offset = layout.elements.length * 4;
            const el = {
              id: makeId(), type,
              x: clamp(12 + offset, 0, canvas.clientWidth - 80),
              y: clamp(12 + offset, 0, canvas.clientHeight - 30),
              w: type === "barcode-image" ? 150 : 120,
              h: type === "barcode-image" ? 55 : 28,
              fontSize: type === "price" ? 16 : 13,
              fontWeight: type === "price" ? "800" : "700",
              textAlign: "center"
            };
            if (type === "custom-text") el.value = "Custom text";
            layout.elements.push(el);
            if (type === "barcode-image") autoSizeBarcode(el);
            selectedId = el.id;
            persistLayout(false);
            render();
          }

          function deleteElement(id = selectedId) {
            if (!id) return;
            layout.elements = layout.elements.filter(el => el.id !== id);
            if (selectedId === id) selectedId = null;
            persistLayout(false);
            render();
          }

          canvas.addEventListener("pointerdown", event => {
            const node = event.target.closest(".designer-element");
            if (!node) {selectedId = null; render(); return;}
            event.preventDefault();
            const id = node.dataset.id;
            selectedId = id;
            const el = selectedElement();
            const resizing = !!event.target.closest("[data-resize]");
            activePointer = {
              id, mode: resizing ? "resize" : "move",
              startX: event.clientX, startY: event.clientY,
              originalX: el.x, originalY: el.y, originalW: el.w, originalH: el.h,
              originalFontSize: Number(el.fontSize) || 14
            };

            render();
          });

          canvas.addEventListener("pointermove", event => {
            if (!activePointer) return;
            const el = layout.elements.find(x => x.id === activePointer.id);
            if (!el) return;
            const dx = (event.clientX - activePointer.startX) / previewScale;
            const dy = (event.clientY - activePointer.startY) / previewScale;
            if (activePointer.mode === "move") {
              el.x = activePointer.originalX + dx;
              el.y = activePointer.originalY + dy;
            } else {
              let newW = Math.max(20, activePointer.originalW + dx);
              let newH = Math.max(18, activePointer.originalH + dy);
              if (el.type === "barcode-image") {
                const safeW = safeBarcodeWidthPx(el);
                const maxW = Math.max(20, canvas.clientWidth - Math.max(0, el.x));
                newW = Math.min(maxW, Math.max(Math.min(safeW, maxW), newW));
                const minBarcodeHeightPx = 10 * PX_PER_MM;
                const maxH = Math.max(18, canvas.clientHeight - Math.max(0, el.y));
                newH = Math.min(maxH, Math.max(Math.min(minBarcodeHeightPx, maxH), newH));
              }
              const scaleX = newW / Math.max(1, activePointer.originalW);
              const scaleY = newH / Math.max(1, activePointer.originalH);
              const contentScale = Math.min(scaleX, scaleY);
              el.w = newW; el.h = newH;

            }
            const node = canvas.querySelector(`[data-id="${el.id}"]`);
            if (node) {
              node.style.left = el.x + "px";
              node.style.top = el.y + "px";
              node.style.width = el.w + "px";
              node.style.height = el.h + "px";
              const content = node.querySelector(".element-content");
              if (content) {
                if (el.type === "barcode-image") content.innerHTML = barcodeInfo(elementText(el)).svg;
                else content.style.fontSize = (el.fontSize || 14) + "px";
              }
            }
            updateProperties();
          });

          function finishPointer() {
            if (!activePointer) return;
            activePointer = null;
            persistLayout(false);
            renderElementList();
          }
          canvas.addEventListener("pointerup", finishPointer);
          canvas.addEventListener("pointercancel", finishPointer);

          document.addEventListener("keydown", event => {
            const el = selectedElement();
            if (!el) return;
            if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
            const step = event.shiftKey ? 10 : 1;
            if (event.key === "Delete") {deleteElement(); return;}
            if (event.key === "ArrowLeft") el.x -= step;
            else if (event.key === "ArrowRight") el.x += step;
            else if (event.key === "ArrowUp") el.y -= step;
            else if (event.key === "ArrowDown") el.y += step;
            else return;
            event.preventDefault();
            persistLayout(false);
            render();
          });

          document.querySelectorAll("[data-add]").forEach(button => {
            button.addEventListener("click", () => addElement(button.dataset.add));
          });

          controls.labelWidth.addEventListener("change", () => {
            layout.widthMm = clamp(Number(controls.labelWidth.value) || 38, 20, 150);
            persistLayout(false); render();
          });
          controls.labelHeight.addEventListener("change", () => {
            layout.heightMm = clamp(Number(controls.labelHeight.value) || 25.4, 15, 100);
            persistLayout(false); render();
          });
          controls.gridToggle.addEventListener("change", () => {
            layout.grid = controls.gridToggle.value === "on";
            persistLayout(false); render();
          });

          function bindProperty(control, property, parser = value => value) {
            control.addEventListener("input", () => {
              const el = selectedElement();
              if (!el) return;
              el[property] = parser(control.value);
              persistLayout(false);
              render();
            });
          }
          controls.text.addEventListener("input", () => {
            const el = selectedElement();
            if (!el) return;
            el.value = controls.text.value;
            if (el.type === "barcode-image") autoSizeBarcode(el);
            persistLayout(false); render();
          });
          bindProperty(controls.fontSize, "fontSize", v => clamp(Number(v) || 14, 6, 200));
          bindProperty(controls.fontWeight, "fontWeight");
          bindProperty(controls.textAlign, "textAlign");
          bindProperty(controls.x, "x", v => Number(v) || 0);
          bindProperty(controls.y, "y", v => Number(v) || 0);
          controls.w.addEventListener("input", () => {
            const el = selectedElement();
            if (!el) return;
            let requested = Math.max(20, Number(controls.w.value) || 20);
            if (el.type === "barcode-image") {
              const safeW = safeBarcodeWidthPx(el);
              const maxW = Math.max(20, canvas.clientWidth - Math.max(0, el.x));
              requested = Math.min(maxW, Math.max(Math.min(safeW, maxW), requested));
            }
            el.w = requested;
            persistLayout(false); render();
          });
          controls.h.addEventListener("input", () => {
            const el = selectedElement();
            if (!el) return;
            let requested = Math.max(18, Number(controls.h.value) || 18);
            if (el.type === "barcode-image") {
              const minH = 10 * PX_PER_MM;
              const maxH = Math.max(18, canvas.clientHeight - Math.max(0, el.y));
              requested = Math.min(maxH, Math.max(Math.min(minH, maxH), requested));
            }
            el.h = requested;
            persistLayout(false); render();
          });

          document.getElementById("deleteButton").addEventListener("click", () => deleteElement());
          document.getElementById("saveButton").addEventListener("click", () => persistLayout(true));
          document.getElementById("resetButton").addEventListener("click", () => {
            if (!confirm("Reset the saved barcode label layout?")) return;
            layout = defaultLayout();
            selectedId = null;
            persistLayout(true);
            render();
          });

          function escapePrintHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
          }

          function buildPrintableElement(el) {
            const leftMm = el.x / PX_PER_MM;
            const topMm = el.y / PX_PER_MM;
            const widthMm = el.w / PX_PER_MM;
            const heightMm = el.h / PX_PER_MM;
            let contentHtml;
            if (el.type === "barcode-image") {
              contentHtml = barcodeInfo(elementText(el)).svg;
            } else {
              const align = el.textAlign || "center";
              const justify = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center";
              contentHtml = `
        <div class="print-content print-text"
             style="font-size:${Number(el.fontSize) || 14}px;
                    font-weight:${escapePrintHtml(el.fontWeight || "700")};
                    text-align:${escapePrintHtml(align)};
                    justify-content:${justify};">
          ${escapePrintHtml(elementText(el))}
        </div>`;
            }
            return `
      <div class="print-element"
           style="left:${leftMm}mm;top:${topMm}mm;width:${widthMm}mm;height:${heightMm}mm;">
        ${el.type === "barcode-image" ? `<div class="print-content print-barcode">${contentHtml}</div>` : contentHtml}
      </div>`;
          }

          function buildPrintDocument(copies) {
            const labels = Array.from({length: copies}, () => `
      <section class="print-label">
        ${layout.elements.map(buildPrintableElement).join("")}
      </section>`).join("");
            return `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Barcode labels</title>
<style>
  * { box-sizing: border-box; }
  @page { size: ${layout.widthMm}mm ${layout.heightMm}mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { width: ${layout.widthMm}mm; }
  .print-label { position: relative; width: ${layout.widthMm}mm; height: ${layout.heightMm}mm; margin: 0; padding: 0; overflow: hidden; background: #fff; break-after: page; page-break-after: always; }
  .print-label:last-child { break-after: auto; page-break-after: auto; }
  .print-element { position: absolute; display: flex; margin: 0; padding: 0; overflow: visible; }
  .print-content { width: 100%; height: 100%; display: flex; align-items: center; overflow: visible; margin: 0; padding: 0; }
  .print-text { line-height: 1.05; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
  .print-barcode svg { display: block; width: 100% !important; height: 100% !important; overflow: visible; }
  .print-barcode svg rect, .print-barcode svg path { shape-rendering: crispEdges; }
  @media print { html, body { width: ${layout.widthMm}mm; height: auto; overflow: visible; } }
</style>
</head>
<body>${labels}</body>
</html>`;
          }

          function printLabels() {
            persistLayout(false);
            const unsafe = layout.elements
              .filter(el => el.type === "barcode-image")
              .map(el => ({el, sizing: barcodeSizing(el)}))
              .filter(x => !x.sizing.safe);
            if (unsafe.length) {
              const detail = unsafe.map((x, i) => {
                const b = x.sizing;
                return `Barcode ${i + 1}: ${b.symbology}, ${b.widthMm.toFixed(1)} × ${b.heightMm.toFixed(1)} mm; required width ${b.minWidthMm.toFixed(1)} mm and minimum height ${b.minHeightMm.toFixed(1)} mm.`;
              }).join("\n");
              alert(`Printing blocked to protect scan reliability.\n\n${detail}\n\nThe program will automatically re-size the barcode. If this message remains, reset the layout.`);
              return;
            }
            const copies = clamp(Number(controls.copyCount.value) || 1, 1, 200);
            const iframe = document.createElement("iframe");
            iframe.setAttribute("aria-hidden", "true");
            iframe.style.position = "fixed";
            iframe.style.right = "0";
            iframe.style.bottom = "0";
            iframe.style.width = "1px";
            iframe.style.height = "1px";
            iframe.style.border = "0";
            iframe.style.opacity = "0";
            iframe.style.pointerEvents = "none";
            document.body.appendChild(iframe);
            const printWindow = iframe.contentWindow;
            const printDocument = iframe.contentDocument || printWindow.document;
            printDocument.open();
            printDocument.write(buildPrintDocument(copies));
            printDocument.close();
            const cleanup = () => {window.setTimeout(() => iframe.remove(), 500);};
            iframe.onload = () => {
              window.setTimeout(() => {
                try {printWindow.focus(); printWindow.print();} finally {cleanup();}
              }, 150);
            };
            window.setTimeout(() => {
              if (!document.body.contains(iframe)) return;
              try {printWindow.focus(); printWindow.print();} finally {cleanup();}
            }, 500);
          }

          document.getElementById("printButton").addEventListener("click", printLabels);

          let resizeFrame = null;
          const resizePreview = () => {
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(() => {if (layout) applyCanvasSize();});
          };

          function refreshItemSummary() {
            itemSummary.textContent = `${data.itemName || "Untitled item"} · ${data.barcode || "No barcode"}`;
          }

          itemInputs.name.addEventListener("input", () => {data.itemName = itemInputs.name.value; refreshItemSummary(); render();});
          itemInputs.price.addEventListener("input", () => {data.price = itemInputs.price.value; render();});
          itemInputs.barcode.addEventListener("input", () => {data.barcode = itemInputs.barcode.value; refreshItemSummary(); render();});
          refreshItemSummary();

          window.addEventListener("resize", resizePreview);
          if ("ResizeObserver" in window) {
            new ResizeObserver(resizePreview).observe(document.querySelector(".canvas-panel"));
          }

          try {
            const savedItem = JSON.parse(localStorage.getItem(STORAGE_KEY + "_item"));
            if (savedItem && typeof savedItem === "object") {
              data.itemName = savedItem.itemName ?? data.itemName;
              data.price = savedItem.price ?? data.price;
              data.barcode = savedItem.barcode ?? data.barcode;
            }
          } catch (error) {console.warn("Could not load saved item data", error);}
          itemInputs.name.value = data.itemName;
          itemInputs.price.value = data.price;
          itemInputs.barcode.value = data.barcode;
          refreshItemSummary();

          layout = loadLayout();
          layout.elements.forEach(el => {if (el.type === "barcode-image") autoSizeBarcode(el);});
          render();
          requestAnimationFrame(resizePreview);
        })();
      </script>
    </template>

    <!-- =========================================================
     SHELL LOGIC
     ========================================================= -->
    <script>
      (() => {
        "use strict";

        const UPDATE_URL = "https://raw.githubusercontent.com/riyadqadri-cmyk/clearbarcode/main/app.html";
        const K_HTML = "barcodepro.shell.html";
        const K_VERSION = "barcodepro.shell.version";
        const K_FETCHED = "barcodepro.shell.fetchedAt";

        const bootScreen = document.getElementById("shellBootScreen");
        const bootError = document.getElementById("shellBootError");
        const appMount = document.getElementById("appMount");
        const appStyleSlot = document.querySelector("style[data-shell-app-style]");

        const modal = document.getElementById("shellModal");
        const modalClose = document.getElementById("shellModalClose");
        const settingsBtn = document.getElementById("shellSettingsButton");
        const updateBtn = document.getElementById("shellUpdateBtn");
        const revertBtn = document.getElementById("shellRevertBtn");
        const statusEl = document.getElementById("shellStatus");
        const infoVersion = document.getElementById("shellInfoVersion");
        const infoSource = document.getElementById("shellInfoSource");
        const infoFetched = document.getElementById("shellInfoFetched");

        function setStatus(text, kind) {
          statusEl.textContent = text;
          statusEl.className = kind || "";
        }
        function showBootError(msg) {
          bootScreen.classList.remove("hidden");
          bootError.textContent = msg || "";
        }
        function hideBootScreen() {
          bootScreen.classList.add("hidden");
          bootError.textContent = "";
        }
        function prettyTime(iso) {
          if (!iso) return "—";
          try {return new Date(iso).toLocaleString();} catch {return iso;}
        }

        // Parse an app HTML document (full document or fragment).
        function parseAppHtml(htmlText) {
          if (typeof htmlText !== "string" || !htmlText.trim()) return null;
          const doc = new DOMParser().parseFromString(htmlText, "text/html");
          if (!doc || !doc.body) return null;

          const styles = Array.from(doc.querySelectorAll("style"))
            .map(s => s.textContent || "")
            .filter(t => t.trim().length > 0);

          const scripts = Array.from(doc.querySelectorAll("script"))
            .filter(s => !s.src)
            .filter(s => {
              const t = (s.getAttribute("type") || "").toLowerCase();
              return t === "" || t === "text/javascript" || t === "module" || t === "application/javascript";
            })
            .map(s => s.textContent || "")
            .filter(t => t.trim().length > 0);

          if (scripts.length === 0) return null;

          const versionMeta = doc.querySelector('meta[name="app-version"]');
          const version = versionMeta ? (versionMeta.getAttribute("content") || null) : null;

          return {
            styles,
            bodyHtml: doc.body.innerHTML,
            scriptText: scripts.join("\n;\n"),
            version
          };
        }

        let currentBlobUrl = null;

        function runApp(parsed) {
          if (currentBlobUrl) {
            try {URL.revokeObjectURL(currentBlobUrl);} catch { }
            currentBlobUrl = null;
          }
          appMount.innerHTML = "";
          appStyleSlot.textContent = "";

          appStyleSlot.textContent = parsed.styles.join("\n\n");
          appMount.innerHTML = parsed.bodyHtml;

          const blob = new Blob([parsed.scriptText], {type: "text/javascript"});
          currentBlobUrl = URL.createObjectURL(blob);
          const scriptEl = document.createElement("script");
          scriptEl.src = currentBlobUrl;
          scriptEl.onload = () => {setTimeout(hideBootScreen, 40);};
          scriptEl.onerror = () => {showBootError("The app script failed to execute.");};
          document.body.appendChild(scriptEl);
          setTimeout(() => {
            if (currentBlobUrl) {
              try {URL.revokeObjectURL(currentBlobUrl);} catch { }
              currentBlobUrl = null;
            }
          }, 2000);
        }

        function loadFromStorage() {
          const stored = localStorage.getItem(K_HTML);
          if (!stored) return null;
          const parsed = parseAppHtml(stored);
          if (!parsed) {
            console.warn("Stored app HTML is malformed; falling back to default.");
            return null;
          }
          parsed.version = localStorage.getItem(K_VERSION) || parsed.version || "unknown";
          return parsed;
        }

        function loadDefault() {
          const tpl = document.getElementById("shell-default-html");
          if (!tpl) throw new Error("Built-in default template is missing.");
          const htmlText = tpl.innerHTML;
          const parsed = parseAppHtml(htmlText);
          if (!parsed) throw new Error("Built-in default HTML is malformed.");
          return parsed;
        }

        function boot() {
          bootScreen.classList.remove("hidden");
          bootError.textContent = "";

          let parsed = loadFromStorage();
          if (!parsed) {
            try {parsed = loadDefault();}
            catch (e) {showBootError(e.message); return;}
          }

          try {runApp(parsed);}
          catch (e) {showBootError("Failed to run app: " + e.message); return;}

          refreshModalInfo();
        }

        function refreshModalInfo() {
          const storedVersion = localStorage.getItem(K_VERSION);
          const fetchedAt = localStorage.getItem(K_FETCHED);
          infoVersion.textContent = storedVersion ? storedVersion : "built-in (frozen)";
          infoSource.textContent = UPDATE_URL;
          infoFetched.textContent = prettyTime(fetchedAt);
        }

        async function doUpdate() {
          updateBtn.disabled = true;
          revertBtn.disabled = true;
          setStatus("Fetching update…", "busy");

          let text;
          try {
            const res = await fetch(UPDATE_URL, {cache: "no-store"});
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            text = await res.text();
          } catch (e) {
            setStatus("Update failed: " + e.message, "err");
            updateBtn.disabled = false;
            revertBtn.disabled = false;
            return;
          }

          const parsed = parseAppHtml(text);
          if (!parsed) {
            setStatus("Update rejected: downloaded file is not a valid app HTML.", "err");
            updateBtn.disabled = false;
            revertBtn.disabled = false;
            return;
          }

          localStorage.setItem(K_HTML, text);
          localStorage.setItem(K_VERSION, parsed.version || "unknown");
          localStorage.setItem(K_FETCHED, new Date().toISOString());

          setStatus("Update downloaded. Reloading app…", "busy");
          try {
            runApp(parsed);
            refreshModalInfo();
            setStatus(`Updated to ${parsed.version || "unknown"} at ${new Date().toLocaleTimeString()}.`, "ok");
          } catch (e) {
            setStatus("Update ran but the app failed to start: " + e.message, "err");
          }
          updateBtn.disabled = false;
          revertBtn.disabled = false;
        }

        function doRevert() {
          if (!confirm("Revert to the built-in default version? Your saved label layout and item data will be kept.")) return;
          localStorage.removeItem(K_HTML);
          localStorage.removeItem(K_VERSION);
          localStorage.removeItem(K_FETCHED);
          setStatus("Reverted to built-in version.", "ok");
          boot();
        }

        function openModal() {
          refreshModalInfo();
          setStatus("Ready.", "");
          modal.classList.add("open");
        }
        function closeModal() {modal.classList.remove("open");}

        settingsBtn.addEventListener("click", openModal);
        modalClose.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {if (e.target === modal) closeModal();});
        document.addEventListener("keydown", (e) => {if (e.key === "Escape" && modal.classList.contains("open")) closeModal();});

        updateBtn.addEventListener("click", doUpdate);
        revertBtn.addEventListener("click", doRevert);

        window.shellAPI = {openSettings: openModal, closeSettings: closeModal};

        boot();
      })();
    </script>
  </body>

</html>
